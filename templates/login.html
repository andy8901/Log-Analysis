{% extends "base.html" %}
{% block title %}Login — Neosky Drone Diagnostic Platform{% endblock %}
{% block content %}
<style>
    .login-shell{
        display:grid; grid-template-columns:1.1fr 1fr; align-items:stretch;
        max-width:900px; margin:50px auto; min-height:460px;
        border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card);
    }
    .login-visual{
        background:linear-gradient(155deg,var(--navy-950),var(--navy-800));
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        padding:36px; position:relative;
    }
    .login-visual .drone-collage{
        display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:340px;
    }
    .login-visual .drone-collage .tile-wide{
        width:100%; height:170px; object-fit:contain; background:#ffffff;
        border-radius:14px; padding:12px; box-sizing:border-box; display:block;
        box-shadow:0 10px 24px rgba(0,0,0,0.35);
    }
    .login-visual .drone-collage .tile-row{ display:flex; gap:14px; width:100%; }
    .login-visual .drone-collage .tile-row img{
        flex:1 1 0; width:0; height:90px; object-fit:contain; background:#ffffff;
        border-radius:12px; padding:8px; box-sizing:border-box; display:block;
        box-shadow:0 8px 18px rgba(0,0,0,0.3);
    }
    .login-visual .tagline{
        color:#cbd5e1; text-align:center; font-size:0.9em; margin-top:22px; line-height:1.5;
        max-width:280px;
    }
    .login-form-side{
        background:var(--card-bg); padding:44px 40px; display:flex; flex-direction:column; justify-content:center;
    }
    .login-form-side .logo-row{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .login-form-side .logo-row img{ width:40px; height:40px; border-radius:11px; box-shadow:var(--shadow-sm); }
    @media (max-width:760px){
        .login-shell{ grid-template-columns:1fr; margin:24px auto; }
        .login-visual{ padding:28px; }
        .login-visual img.hero-drone{ max-height:180px; }
    }
</style>

<div class="login-shell">
    <div class="login-visual">
        <div class="drone-collage">
            <img class="tile-wide" src="{{ url_for('static', filename='drones/tavas.png') }}" alt="Tavas">
            <div class="tile-row">
                <img src="{{ url_for('static', filename='drones/nimble.png') }}" alt="Nimble">
                <img src="{{ url_for('static', filename='drones/generic.webp') }}" alt="Fleet drone">
            </div>
        </div>
        <p class="tagline">Upload a flight log, get a full diagnostic back &mdash; status, root-cause alerts, charts, and a 3D flight replay.</p>
    </div>
    <div class="login-form-side">
        <div class="logo-row">
            <img src="{{ url_for('static', filename='logo-icon.png') }}" alt="Neosky">
            <div>
                <h2 style="margin:0;">Neosky</h2>
                <p style="color:var(--text-muted);font-size:0.82em;margin:0;">Drone Diagnostic Platform</p>
            </div>
        </div>
        <form method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button class="btn" type="submit" style="width:100%;margin-top:6px;padding:12px;">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
